# ============================================================================
# 設定ファイル (ポイント・キャンペーン日程・手持ちクーポン・購入予定日) のひな形
#
#   ★ 通常は結果ページ (docs/arbitrage.html) の「設定」画面で編集する。
#      画面で保存した内容は Supabase に入り、python -m arbitrage.run はそれを読む。
#      このファイルは --config-file 用 (画面を使わずにファイルで指定したいとき・試行用)。
#
#   使い方: このファイルをコピーして書き換え、
#           .venv/bin/python -m arbitrage.run --config-file config/campaigns.yaml
#           のように指定する (config/campaigns.yaml は Git に含まれない)。
#           書式は画面が保存する設定 JSON と同じ。拡張子が .json なら JSON として読む。
#
#   ★ 下に書いてある率・上限・日付・クーポンは「例」。そのまま使うと利益の計算が狂うので必ず書き換えること。
# ============================================================================
#
# ■ このファイルに書くもの / 書かないもの
#
#   書くもの
#     version       : 1 (固定)
#     purchase_date : 購入予定日。この日のキャンペーン・クーポン・ボーナスストアPlus枠で計算する
#     common        : 毎日かならず付くポイント (カード決済、LYPプレミアム会員 など)
#     campaigns     : 日付指定のキャンペーン (日曜の +5%、5のつく日、全体加算日 など)。
#                     1 か月分をまとめて登録しておけば、購入予定日が dates に含まれるものだけが使われる
#     coupons       : 手持ちクーポン (ログインしないと見えないクーポン、モールクーポン など)
#     store_upsell  : 店ごとのストアポイント上乗せ率 (ログインしないと商品ページに出ない店の分)
#     bsplus        : ボーナスストアPlus の「上限」だけ (率は書かない)
#
#   書かないもの (プログラムが自動で読むので、ここに書くと二重に数えてしまう)
#     ストアポイント (基本 1% + お店ごとの上乗せ)  → 商品ページから読む
#     ボーナスストアPlus の率 (+4% / +9%)          → 店舗リスト (data/*.xlsx) の購入予定日の枠から読む
#     商品ページに出ている公開クーポン             → 商品ページから読む
#
#   ★ 全体加算日の「+2%」「+3%」は自動では付かない。campaigns に 2 行で登録する (下の例を参照)。
#
# ■ 購入予定日 (purchase_date)
#
#   YYYY-MM-DD で書く。例) purchase_date: 2026-10-11
#   ・その日が dates に含まれるキャンペーン、その日が有効期間内のクーポンだけが計算に使われる
#   ・ボーナスストアPlus の枠も、店舗リストのその日の列から読む
#     (店舗リストの掲載期間の外の日付だとエラーで止まる → 新しいリストに差し替える)
#   ・実行時に --date 2026-10-18 のように付けると、その回だけ別の日付で計算する
#
# ■ ポイントの計算方法
#
#   「その商品を 1 つだけ買う」前提で、枠 (common と campaigns の 1 項目ずつ) ごとに
#
#       付与ポイント = クーポン値引き後の価格 × rate   (1pt 未満は切り捨て)
#                      ただし上限があれば、上限まで
#
#   を出して合計する。
#     例) 税込 55,000 円の商品、2,000 円 OFF クーポン、rate: 0.05、上限 3,000pt の場合
#         クーポン後 53,000 円 → 税抜 48,182 円 × 5% = 2,409pt (上限 3,000 に届かないのでそのまま)
#
# ■ common / campaigns の 1 項目に書けるキー
#   (これ以外のキーを書くとエラーで止まる。綴りの間違い防止のため)
#
#   name            必須  名前。結果ページのポイント内訳にそのまま表示される。
#                         common と campaigns を通して、同じ名前は 2 つ書けない
#
#   rate            必須  付与率を「小数」で書く (0 より大きく 1 以下)。
#                           1%   → 0.01      2.5% → 0.025
#                           5%   → 0.05      10%  → 0.1
#                         ※ 5 と書くと 500% の意味になるのでエラーで止まる
#
#   base            省略可  率を掛ける金額。省略すると tax_excluded
#                           tax_excluded : 税抜価格に掛ける (Yahoo!ショッピングのほとんどのポイント)
#                           tax_included : 税込価格に掛ける (「税込決済額対象」と書かれているもの。
#                                          PayPayカード / PayPay残高の決済特典など)
#
#   cap_per_order   省略可  1 回の注文でもらえる上限 (pt)。上限なしなら null か、行ごと省略
#   cap_per_period  省略可  キャンペーン期間 (1 日・1 か月など) を通してもらえる上限 (pt)。同上
#                           ・両方書いた場合は「小さい方」を上限として使う
#                           ・期間の上限は「この商品を買う前に、まだ 1pt も使っていない」前提で計算する。
#                             今月すでに上限の一部を使っているなら、残りの pt 数を書くこと
#                           ・上限に届いた枠は、結果ページに「上限到達」と表示される
#
#   min_purchase    省略可  最低購入額 (円、税込・クーポン値引き後)。この金額に満たない商品には付けない
#                           例) 「5,000 円以上の購入が対象」なら 5000
#
# ■ campaigns だけに書けるキー
#
#   dates           必須  キャンペーンの日付のリスト (1 件以上、YYYY-MM-DD、同じ日付は 2 回書けない)。
#                         購入予定日がこの中にあるときだけ、そのキャンペーンが計算に入る
#                           例) dates: [2026-10-04, 2026-10-11, 2026-10-18, 2026-10-25]
#
#   target          省略可  どの店の商品に付くか。省略すると all
#                           all         : すべての店
#                           bsplus      : 購入予定日に、ボーナスストアPlus の枠がある店だけ
#                           bsplus_good : 枠があり、かつ優良ストア (店舗リストの「優良ストア」列が ○) の店だけ
#                           good_store  : 優良ストアだけ
#                           page        : 商品ページの「ポイント内訳」に、そのキャンペーンの行が
#                                         出ている店だけ。「対象ストア限定」のキャンペーンはこれを使う。
#                                         page_title も必ず書く
#                           stores      : store_ids に書いた店だけ。store_ids も必ず書く
#
#   page_title      target: page のとき必須。商品ページのポイント内訳に出る行の名前の「一部」。
#                           その文字を含む行があれば対象とみなす。
#                           例) 行の名前が「プレミアムな日曜日 ＋5％【対象ストア限定】」なら
#                               page_title: プレミアムな日曜日
#
#   store_ids       target: stores のとき必須 (1 件以上)。店ID は商品ページの URL
#                               https://store.shopping.yahoo.co.jp/★ここ★/xxxx.html
#                           例) store_ids: [joshin, yamada-denki]
#
#   entry_required  省略可  true / false。エントリーが必要なキャンペーンの覚え書き (計算には使わない)。
#                           エントリーを忘れるとポイントは付かないので、買う前に必ずエントリーすること
#
# ■ 全体加算日 (ボーナスストアPlus の店に +2%、さらに優良ストアなら +3%)
#
#   「+2%」と「+3%」は別々の上限を持つ独立したキャンペーンなので、2 行に分けて登録する:
#     ・+2% → target: bsplus       (枠のある店すべて)
#     ・+3% → target: bsplus_good  (枠があり、かつ優良ストア)
#   優良ストアには両方が付く (合計 +5%)。店舗リスト 1 行目の「+2」「+2/+3」の表記は計算に使わない。
#
# ■ coupons (手持ちクーポン) の 1 項目に書けるキー
#
#   商品ページに出ないクーポン (アカウントで獲得済みの限定クーポン、モールクーポン など) を登録する。
#   クーポンは 1 注文に 1 枚だけで、併用はしない。商品ページで見つけた公開クーポンと、ここに書いた
#   クーポンのうち、利益がいちばん大きくなる 1 枚 (または「使わない」) をプログラムが選ぶ。
#
#   name            必須  名前。結果ページに表示される。coupons の中で同じ名前は 2 つ書けない
#   type            必須  fixed (定額: ○円 OFF) か percent (定率: ○% OFF)
#   value           必須  fixed   : 値引き額 (円、1 以上の整数)              例) 2,000 円 OFF → 2000
#                         percent : 値引き率 (0 より大きく 1 以下の小数)      例) 10% OFF → 0.1
#   max_discount    省略可  percent のときの値引き上限 (円)。上限なしなら null。fixed では書かない (null)
#                           例) 「10% OFF、最大 3,000 円引き」なら value: 0.1 / max_discount: 3000
#   min_purchase    省略可  最低購入額 (円、税込の販売価格)。条件なしなら 0
#                           例) 「60,000 円以上で使える」なら 60000
#   target          省略可  all (すべての店) か stores (store_ids の店だけ)。省略すると all
#   store_ids       target: stores のとき必須 (1 件以上)
#   valid_from      省略可  有効期間の開始日 (YYYY-MM-DD)。制限なしなら null
#   valid_until     省略可  有効期間の終了日 (YYYY-MM-DD、その日も使える)。制限なしなら null
#                           ・購入予定日が期間の外のクーポンは使われない
#
#   値引き額: fixed は value、percent は 販売価格 × value (1 円未満切り捨て、max_discount まで)。
#             値引き額が販売価格以上になる商品には使わない。
#
# ■ store_upsell (店ごとのポイント上乗せ) の 1 項目に書けるキー
#
#   ストアポイントの上乗せ (+13% など) を、ログインしたときにしか表示しない店がある
#   (例: デンキチWeb Yahoo!店。ログインなしのページは上乗せ 0%、ログインすると 14%)。
#   プログラムはログインせずに商品ページを読むので、その店の上乗せをここに手で登録する。
#   計算では「ページに出ている上乗せ率」と「ここに書いた率」の大きい方を使う (足さない)。
#
#   store_id        必須  店ID (商品ページ URL の https://store.shopping.yahoo.co.jp/★ここ★/...)
#   rate            必須  ログイン時に表示される上乗せ率そのもの (0 より大きく 1 以下の小数)。
#                         「ストアポイント 15%」と出るなら上乗せは 14% なので 0.14。
#                         基本の 1% はプログラムが足すので、ここに含めない
#   note            省略可  メモ (計算には使わない)
#   valid_from      省略可  有効期間の開始日 (YYYY-MM-DD)。制限なしなら null
#   valid_until     省略可  有効期間の終了日 (YYYY-MM-DD、その日も有効)。制限なしなら null
#
#   同じ店で有効期間が重なる行は 2 つ書けない (期間をずらせば率の変更を先に登録できる)。
#
# ■ よくある間違い
#
#   ・rate や percent の value を % のまま書く (5% を 5 と書く)   → エラーで止まる
#   ・上限を cap と書く (正しくは cap_per_order / cap_per_period) → エラーで止まる
#   ・ストアポイントやボーナスストアPlus の率をここに書く        → 二重に数えて利益が多く出てしまう
#   ・全体加算日の +2% / +3% を登録し忘れる                      → ポイントが少なく計算される
#   ・使い終わったクーポンを消し忘れる (valid_until も無い)      → 使えない値引きを数えてしまう
#   ・字下げ (行頭の空白) をずらす。空白は半角で、タブは使わない → エラーで止まる
#
# ■ 書き終わったら
#
#   .venv/bin/python -m arbitrage.run --check-config --config-file config/campaigns.yaml
#   を実行すると、読み込み元・購入予定日・その日に有効なキャンペーンとクーポン・
#   日付外で無効になっている件数が一覧で表示される。
#   書き方に間違いがあれば、その場所と理由が表示される。
#   別の日付で確認するなら --date 2026-10-18 のように付ける。
#   (--config-file を付けなければ、設定画面で保存した Supabase の設定を確認する)
# ============================================================================


version: 1

# 購入予定日 (← 例。買う日に書き換える)
purchase_date: 2026-10-11


# ----------------------------------------------------------------------------
# common: 毎日かならず付く分 (自分の会員状態・支払い方法で決まるもの)
# ----------------------------------------------------------------------------
common:
  - name: PayPayカード決済       # ← 例。自分の支払い方法に合わせて書き換える
    rate: 0.01                   # 1%
    base: tax_included           # 「税込決済額対象」なので税込価格に掛ける
    cap_per_order: null          # 上限なし
    cap_per_period: null

  - name: LYPプレミアム会員      # ← 例。会員でなければこの項目ごと消す
    rate: 0.02                   # 2%
    cap_per_order: null
    cap_per_period: 5000         # 期間を通して 5,000pt まで


# ----------------------------------------------------------------------------
# campaigns: 日付指定のキャンペーン (いくつでも並べられる。無ければ「campaigns: []」と書く)
# ----------------------------------------------------------------------------
campaigns:
  - name: プレミアムな日曜日     # ← 例
    rate: 0.05                   # 5%
    cap_per_order: null
    cap_per_period: 3000         # 期間を通して 3,000pt まで
    min_purchase: 5000           # 5,000 円 (税込・クーポン後) 以上の商品だけ
    entry_required: true         # エントリーが必要 (覚え書き)
    target: page                 # 対象ストア限定 → 商品ページに行が出ている店だけ
    page_title: プレミアムな日曜日
    dates: [2026-10-04, 2026-10-11, 2026-10-18, 2026-10-25]

  # 全体加算日 (← 例): 「+2%」と「+3%」を 2 行で登録する。優良ストアには両方付く
  - name: ボーナスストアPlus 全体加算 +2%
    rate: 0.02
    cap_per_period: 1000         # ← 例。それぞれのキャンペーンの上限を書く
    target: bsplus               # 枠のある店すべて
    dates: [2026-10-11, 2026-10-25]

  - name: ボーナスストアPlus 優良ストア加算 +3%
    rate: 0.03
    cap_per_period: 1500
    target: bsplus_good          # 枠があり、かつ優良ストア
    dates: [2026-10-11]

  # 書き方の例 (行頭の「# 」を外すと有効になる)
  #
  # すべての店が対象のキャンペーン:
  # - name: 5のつく日
  #   rate: 0.04
  #   cap_per_period: 1000
  #   entry_required: true
  #   target: all
  #   dates: [2026-10-05, 2026-10-15, 2026-10-25]
  #
  # 優良ストアだけが対象のキャンペーン:
  # - name: 優良ストア特典
  #   rate: 0.02
  #   target: good_store
  #   dates: [2026-10-11]
  #
  # 特定の店だけが対象のキャンペーン:
  # - name: ジョーシン独自キャンペーン
  #   rate: 0.03
  #   cap_per_order: 2000
  #   target: stores
  #   store_ids: [joshin]
  #   dates: [2026-10-10, 2026-10-11]


# ----------------------------------------------------------------------------
# coupons: 手持ちクーポン (無ければ「coupons: []」と書く)。1 注文 1 枚、併用なし
# ----------------------------------------------------------------------------
coupons:
  - name: Joshin 2,000円OFF      # ← 例。獲得済みの限定クーポン (ログインしないと見えない)
    type: fixed                  # 定額
    value: 2000                  # 2,000 円 OFF
    min_purchase: 60000          # 60,000 円 (税込) 以上で使える
    target: stores
    store_ids: [joshin]
    valid_from: null
    valid_until: 2026-10-12      # この日まで使える

  # 書き方の例 (行頭の「# 」を外すと有効になる)
  #
  # どの店でも使える定率クーポン (10% OFF、最大 3,000 円引き):
  # - name: モールクーポン 10%OFF
  #   type: percent
  #   value: 0.1
  #   max_discount: 3000
  #   min_purchase: 10000
  #   target: all
  #   valid_from: 2026-10-10
  #   valid_until: 2026-10-11


# ----------------------------------------------------------------------------
# store_upsell: 店ごとのポイント上乗せ (無ければ「store_upsell: []」と書くか、省略する)
#   ログインしないと表示されない上乗せを手で登録する。ページの率と設定の率の大きい方で計算する
# ----------------------------------------------------------------------------
store_upsell:
  - store_id: denkichiweb       # ← 例。デンキチWeb Yahoo!店
    rate: 0.14                  # ログイン時に表示される上乗せ率 (ストアポイント 15% なら 0.14)
    note: ログイン時のみ表示
    valid_from: 2026-10-08
    valid_until: 2026-10-31


# ----------------------------------------------------------------------------
# bsplus: ボーナスストアPlus
#   率 (+4% / +9%) は店舗リストの購入予定日の枠から自動で読むので、ここには「上限」だけ書く。
#   全体加算日の +2% / +3% は、上の campaigns に登録する。
# ----------------------------------------------------------------------------
bsplus:
  cap_per_order: null            # 1 回の注文でもらえる上限 (pt)。上限なしなら null
  cap_per_period: null           # 期間を通してもらえる上限 (pt)。上限なしなら null
