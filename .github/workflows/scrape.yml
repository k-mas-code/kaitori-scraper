name: Daily Scrape

on:
  schedule:
    # UTC 03:00 = JST 12:00
    - cron: '0 3 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape kaitorishouten
        id: kaitorishouten
        # 1サイトが失敗しても残りは実行する (最後の Check ステップでジョブを失敗させる)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py

      - name: Scrape rudeya
        id: rudeya
        # 1サイトが失敗しても残りは実行する (最後の Check ステップでジョブを失敗させる)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rudeya_scraper.py

      - name: Scrape kaitoriwiki
        id: kaitoriwiki
        # 1サイトが失敗しても残りは実行する (最後の Check ステップでジョブを失敗させる)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python kaitoriwiki_scraper.py

      - name: Upload JSON snapshots as artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrape-output-${{ github.run_id }}
          path: output/*.json
          retention-days: 30

      - name: Fail job if any scraper failed
        if: steps.kaitorishouten.outcome != 'success' || steps.rudeya.outcome != 'success' || steps.kaitoriwiki.outcome != 'success'
        run: |
          echo "kaitorishouten: ${{ steps.kaitorishouten.outcome }}"
          echo "rudeya:         ${{ steps.rudeya.outcome }}"
          echo "kaitoriwiki:    ${{ steps.kaitoriwiki.outcome }}"
          exit 1
