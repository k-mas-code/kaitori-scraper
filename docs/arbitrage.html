<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>利益商品リスト</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💴</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white shadow-sm sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-2">
      <h1 class="text-lg font-bold text-slate-700 whitespace-nowrap">💴 利益商品リスト</h1>
      <span class="text-xs text-slate-400 hidden sm:inline">Yahoo!ショッピングで買って買取店に売る</span>
      <span class="flex-1"></span>
      <a href="index.html" class="text-sm text-blue-600 hover:underline whitespace-nowrap">買取価格チェッカー</a>
      <button id="logout-btn" type="button" class="hidden text-sm text-slate-500 hover:text-slate-800 hover:underline whitespace-nowrap">ログアウト</button>
    </div>
  </header>

  <!-- 利益商品リスト / リサーチ / 設定 の切り替え (ログイン時のみ) -->
  <nav id="tabs" class="hidden max-w-5xl mx-auto px-4 pt-4 flex flex-wrap gap-2" role="tablist" aria-label="画面の切り替え">
    <button id="tab-results" type="button" role="tab" aria-selected="true" aria-controls="app"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">利益商品リスト</button>
    <button id="tab-research" type="button" role="tab" aria-selected="false" aria-controls="research"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 shadow-sm hover:bg-slate-100">リサーチ</button>
    <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="settings"
            class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 shadow-sm hover:bg-slate-100">設定</button>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-4">

    <!-- ログイン -->
    <section id="login-card" class="hidden max-w-md mx-auto bg-white rounded-lg shadow p-5 mt-8">
      <h2 class="font-semibold text-slate-700 mb-1">ログイン</h2>
      <p class="text-sm text-slate-500 mb-4">登録済みのメールアドレスに、ログイン用のリンクを送ります。</p>
      <form id="login-form" class="flex gap-2">
        <input id="login-email" type="email" required autocomplete="email" placeholder="メールアドレス"
               class="flex-1 min-w-0 px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-base">
        <button id="login-submit" type="submit"
                class="px-4 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium shrink-0">送信</button>
      </form>
      <p id="login-message" class="text-sm mt-3" role="status"></p>
    </section>

    <!-- 結果 -->
    <section id="app" class="hidden" role="tabpanel" aria-labelledby="tab-results">
      <div class="bg-white rounded-lg shadow p-4 mb-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
        <label class="block text-sm">
          <span class="text-slate-500">実行日</span>
          <select id="run-select" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"></select>
        </label>
        <label class="block text-sm">
          <span class="text-slate-500">最低利益率 (%)</span>
          <input id="min-rate" type="number" step="0.5" value="" placeholder="指定なし" inputmode="decimal"
                 class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300">
        </label>
        <label class="block text-sm">
          <span class="text-slate-500">カテゴリ</span>
          <select id="category-select" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"></select>
        </label>
        <label class="block text-sm">
          <span class="text-slate-500">店舗</span>
          <select id="store-select" class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"></select>
        </label>
      </div>

      <div id="status" class="text-sm text-slate-500 pb-3" role="status"></div>

      <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100 text-slate-600 text-left">
            <tr>
              <th class="px-3 py-2 font-medium text-right whitespace-nowrap">利益率</th>
              <th class="px-3 py-2 font-medium text-right whitespace-nowrap">利益</th>
              <th class="px-3 py-2 font-medium">商品 / 店舗</th>
              <th class="px-3 py-2 font-medium text-right whitespace-nowrap">販売価格</th>
              <th class="px-3 py-2 font-medium text-right whitespace-nowrap">実質価格</th>
              <th class="px-3 py-2 font-medium text-right whitespace-nowrap">買取価格</th>
            </tr>
          </thead>
          <tbody id="result-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- リサーチ (中身は arbitrage-research.js が組み立てる) -->
    <section id="research" class="hidden" role="tabpanel" aria-labelledby="tab-research">
      <p class="text-sm text-slate-500 pb-3">
        条件を決めて「リサーチ実行」を押すと、PC で起動しておいた待ち受けが利益商品の探索を始めます。進み具合はこの画面で確認できます。
      </p>
      <div data-research="status" class="text-sm text-slate-500 pb-3" role="status"></div>
      <div data-research="body"></div>
    </section>

    <!-- 設定 (中身は arbitrage-settings.js が組み立てる) -->
    <section id="settings" class="hidden" role="tabpanel" aria-labelledby="tab-settings">
      <p class="text-sm text-slate-500 pb-3">
        利益計算に使うポイント・キャンペーン日程・手持ちクーポンと、購入予定日を登録します。保存した内容は次回の実行から使われます。
      </p>
      <div data-settings="status" class="text-sm text-slate-500 pb-3" role="status"></div>
      <div data-settings="summary" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4" role="alert"></div>
      <div data-settings="body"></div>
      <div class="sticky bottom-0 bg-slate-50/95 border-t border-slate-200 py-3 flex flex-wrap items-center gap-3">
        <button data-settings="save" type="button" disabled
                class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium">保存</button>
        <span data-settings="dirty" class="hidden text-sm text-amber-700">未保存の変更があります</span>
        <span class="flex-1"></span>
        <span data-settings="updated" class="text-xs text-slate-500"></span>
      </div>
    </section>

  </main>

  <script src="config.js"></script>
  <script type="module" src="arbitrage.js"></script>
</body>
</html>
